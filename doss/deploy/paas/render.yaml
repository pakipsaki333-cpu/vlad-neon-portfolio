# Render.com blueprint: Doss целиком на бесплатном тарифе, БЕЗ карты.
#
# Render → New → Blueprint → выбрать этот репозиторий и ветку.
# Создадутся два сервиса:
#   1) doss-ws  — VPN-узел (VLESS + WebSocket)
#   2) doss-bot — Telegram-бот (выдаёт ту же ссылку)
#
# После первого деплоя:
#   • в логах doss-ws  возьми строку vless://…  → это твой ключ
#   • в doss-bot вставь BOT_TOKEN и DOSS_LINK (ту самую ссылку)
#
# Ограничения бесплатного тарифа Render: 750 ч/мес, 512 МБ, 5 ГБ трафика,
# засыпание через 15 минут простоя. Для «себе и паре друзей» — ок,
# для сервиса на сотни людей — нужен VPS (см. ../docs/no-card.md).

services:
  # ---------------------------------------------------------------- VPN-узел
  - type: web
    name: doss-ws
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./doss/deploy/paas/Dockerfile
    dockerContext: ./doss/deploy/paas
    autoDeploy: true
    # healthCheckPath не задаём: внутри только xray, он не отвечает 200 на "/"
    envVars:
      - key: DOSS_PATH
        value: /doss-ws
      - key: DOSS_LOGLEVEL
        value: warning
      # UUID стабилен и выводится из RENDER_SERVICE_ID.
      # Хочешь свой — раскомментируй и впиши:
      # - key: DOSS_UUID
      #   sync: false

  # ------------------------------------------------------------- Telegram-бот
  - type: web
    name: doss-bot
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./doss/deploy/paas/bot/Dockerfile
    dockerContext: ./doss/bot
    autoDeploy: true
    healthCheckPath: /            # у бота есть health-сервер, "/" отдаёт 200
    envVars:
      - key: BOT_TOKEN
        sync: false               # вписать в панели Render
      - key: DOSS_LINK
        sync: false               # vless://… из логов doss-ws
      - key: PROVIDER
        value: link
      - key: TRIAL_DAYS
        value: "3"
      - key: TRIAL_GB
        value: "10"
      - key: PLAN_DAYS
        value: "30"
      - key: STARS_PRICE
        value: "150"
