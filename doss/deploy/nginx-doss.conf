# TLS для панели и подписок. Certbot: certbot --nginx -d vpn.example.com
# Подписки отдаём только по HTTPS и только по токену из 32 hex-символов.
server {
    listen 443 ssl http2;
    server_name vpn.example.com;

    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # админка только с твоего IP (подставь свой)
    location /admin {
        allow 203.0.113.45;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # подписки не индексируем
    location ~ ^/s/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/doss.access.log;
}

server {
    listen 80;
    server_name vpn.example.com;
    return 301 https://$host$request_uri;
}
