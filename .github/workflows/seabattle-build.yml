name: seabattle · тесты и сборка exe

# Помощник для морского боя: тесты на Linux, затем на Windows — тесты, самопроверка
# с настоящим захватом экрана, сборка SeaBattleHelper.exe и самопроверка уже собранного exe.
on:
  push:
    branches: ["**"]          # только ветки: пуш тега не запускает лишнюю сборку (для тегов есть release)
    paths:
      - "seabattle-helper/**"
      - ".github/workflows/seabattle-build.yml"
  pull_request:
    paths:
      - "seabattle-helper/**"
  release:
    types: [published]        # релиз с тегом seabattle-v* → exe собирается и прикрепляется к нему
  workflow_dispatch:

concurrency:
  group: seabattle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: тесты (Linux)
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'seabattle-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seabattle-helper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install numpy pytest pillow pytest-github-actions-annotate-failures
      - name: Тесты (решатель, распознавание, расстановка)
        run: python -m pytest -q -rfE

  windows:
    name: exe для Windows + самопроверка
    runs-on: windows-latest
    needs: tests
    timeout-minutes: 30
    defaults:
      run:
        working-directory: seabattle-helper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install -r requirements-dev.txt pyinstaller pytest-github-actions-annotate-failures
          python -c "import sys, PySide6, numpy; print(f'::notice title=Версии::Python {sys.version.split()[0]}, PySide6 {PySide6.__version__}, numpy {numpy.__version__}')"
      - name: Тесты на Windows
        timeout-minutes: 10
        run: python -m pytest -q -rfE
      - name: Самопроверка из исходников (захват экрана, распознавание, подсказки)
        timeout-minutes: 6
        run: python -m seabattle --selftest selftest_src
      - name: Самопроверка автоигры из исходников (настоящие щелчки мыши, ход соперника)
        timeout-minutes: 6
        run: python -m seabattle --selftest selftest_auto --auto
      - name: Иконка
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -m seabattle --make-icon build/icon.ico
      - name: Сборка SeaBattleHelper.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SeaBattleHelper --icon build/icon.ico --exclude-module tkinter launcher.py
      - name: Самопроверка собранного exe
        timeout-minutes: 6
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/SeaBattleHelper.exe" -ArgumentList "--selftest", "selftest_exe" -Wait -PassThru
          Get-Content selftest_exe/report.json
          "Размер exe: {0:N1} МБ" -f ((Get-Item dist/SeaBattleHelper.exe).Length / 1MB)
          exit $p.ExitCode
      - name: Самопроверка автоигры в собранном exe
        timeout-minutes: 6
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/SeaBattleHelper.exe" -ArgumentList "--selftest", "selftest_exe_auto", "--auto" -Wait -PassThru
          Get-Content selftest_exe_auto/report.json
          exit $p.ExitCode
      - name: Итоги самопроверки (аннотации)
        if: always()
        shell: pwsh
        run: |
          foreach ($d in "selftest_src", "selftest_auto", "selftest_exe", "selftest_exe_auto") {
            $f = Join-Path $d "report.json"
            if (Test-Path $f) {
              $r = Get-Content $f -Raw -Encoding utf8 | ConvertFrom-Json
              $scr = ($r.screens | ForEach-Object { "$($_.geometry -join 'x')@$($_.dpr)" }) -join ", "
              $auto = ""
              if ($r.auto) {
                $a = $r.auto
                $auto = " auto: mouse=$($a.mouse) clicks=$($a.clicks) answered=$($a.answered) ignored=$($a.ignored_by_practice) board_clicks=$($a.board_clicks) mismatch=$($a.click_cell_mismatch) native=$($a.native_origin -join ',') qt=$($a.qt_origin -join ',') note=$($a.note)"
              }
              $err = ""
              if ($r.errors.Count) { $err = " first_error=" + (($r.errors[0] -replace "[`r`n]+", " ") -replace "::", ": ") }
              Write-Output "::notice title=Самопроверка $d::v$($r.version) ok=$($r.ok) mode=$($r.mode) won=$($r.won) shots=$($r.shots) max_lag=$($r.max_lag_s)s time=$($r.elapsed_s)s grids=$($r.grids_on_screen) screens=$scr errors=$($r.errors.Count) hidden_api=$($r.capture_hidden_main)/$($r.capture_hidden_overlay) main_in_capture=$($r.main_window_in_capture) diff=$($r.main_window_pixels_diff)$auto$err"
            } else {
              Write-Output "::warning title=Самопроверка $d::report.json не найден"
            }
            $h = Join-Path $d "hang.txt"
            if ((Test-Path $h) -and ((Get-Item $h).Length -gt 0)) {
              $t = (Get-Content $h -Raw -Encoding utf8) -replace "[`r`n]+", " | " -replace "::", ": "
              if ($t.Length -gt 3000) { $t = $t.Substring(0, 3000) }
              Write-Output "::warning title=Зависание $d::$t"
            }
            $pl = Join-Path $d "progress.log"
            if (Test-Path $pl) {
              $tail = ((Get-Content $pl -Encoding utf8 | Select-Object -Last 8) -join " | ") -replace "::", ": "
              Write-Output "::notice title=Ход самопроверки $d::$tail"
            }
          }
          if (Test-Path dist/SeaBattleHelper.exe) {
            $mb = "{0:N1}" -f ((Get-Item dist/SeaBattleHelper.exe).Length / 1MB)
            Write-Output "::notice title=SeaBattleHelper.exe::размер $mb МБ"
          }
      - name: exe
        uses: actions/upload-artifact@v7
        with:
          name: SeaBattleHelper-windows
          path: seabattle-helper/dist/SeaBattleHelper.exe
          if-no-files-found: error
      - name: Отчёты самопроверки и скриншоты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-reports
          path: |
            seabattle-helper/selftest_src
            seabattle-helper/selftest_auto
            seabattle-helper/selftest_exe
            seabattle-helper/selftest_exe_auto
          if-no-files-found: ignore

  release-asset:
    name: exe в релиз
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'seabattle-')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SeaBattleHelper-windows
          path: dist
      - name: Прикрепить SeaBattleHelper.exe к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/SeaBattleHelper.exe --clobber --repo "${{ github.repository }}"
