name: doss · keepalive (не даём бесплатному хостингу заснуть)

# Бесплатный Render засыпает через 15 минут без входящего трафика.
# Этот workflow пинает сервис каждые 10 минут — бесплатно, без внешних сервисов.
#
# Настройка (один раз): Settings → Secrets and variables → Actions → Variables →
#   Name: DOSS_WS_URL   Value: https://doss-ws-xxxx.onrender.com
# Если переменная не задана — workflow просто ничего не делает.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: doss-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг сервиса
        env:
          URL: ${{ vars.DOSS_WS_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "vars.DOSS_WS_URL не задан — пропускаю (см. DEPLOY.md, шаг 5)"
            exit 0
          fi
          for i in 1 2 3; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL" || true)"
            echo "попытка $i → HTTP $code"
            if [ "$code" != "000" ]; then
              echo "сервис проснулся и отвечает"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::сервис не ответил за 3 попытки — возможно, спит или упал"
